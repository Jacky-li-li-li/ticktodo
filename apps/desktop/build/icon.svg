<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Ticktodo app icon">
  <!--
    macOS app icon master — Apple HIG full-bleed:
    • 1024×1024 opaque canvas (system applies squircle; do NOT bake corners)
    • Artwork fills large-circle mass; plate covers entire canvas
    • IP: white stroke / wireframe cloud-bean + antenna (confirmed outline style;
      NOT the solid-fill mascot). Tray templates untouched.
  -->
  <defs>
    <linearGradient id="plate" x1="512" y1="0" x2="512" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E2B45"/>
      <stop offset="42%" stop-color="#121A27"/>
      <stop offset="100%" stop-color="#070B12"/>
    </linearGradient>
    <radialGradient id="sheen" cx="36%" cy="20%" r="58%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <path id="bean"
      d="M0 -248
         C118 -248 225 -175 248 -55
         C258 15 242 78 205 120
         C230 148 248 188 248 228
         C248 278 205 312 155 312
         C118 312 92 292 78 268
         C62 298 32 318 0 318
         C-32 318 -62 298 -78 268
         C-92 292 -118 312 -155 312
         C-205 312 -248 278 -248 228
         C-248 188 -230 148 -205 120
         C-242 78 -258 15 -248 -55
         C-225 -175 -118 -248 0 -248 Z"/>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000000" flood-opacity="0.36"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#plate)"/>
  <rect width="1024" height="1024" fill="url(#sheen)"/>

  <!-- ~1.58× / 1.34× → body ~780–860 wide, antenna clear of top edge, lobes clear of bottom -->
  <g transform="translate(512 540) scale(1.66 1.40)" filter="url(#lift)">
    <use href="#bean" fill="none" stroke="#F7FAFF" stroke-width="38" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- eyes: white discs + dark pupils + white glints (confirmed outline language) -->
    <circle cx="-78" cy="-28" r="50" fill="#F7FAFF"/>
    <circle cx="78" cy="-28" r="50" fill="#F7FAFF"/>
    <circle cx="-78" cy="-22" r="22" fill="#0B1220"/>
    <circle cx="78" cy="-22" r="22" fill="#0B1220"/>
    <circle cx="-66" cy="-36" r="9" fill="#F7FAFF"/>
    <circle cx="90" cy="-36" r="9" fill="#F7FAFF"/>
    <circle cx="-86" cy="-10" r="4.5" fill="#F7FAFF" opacity="0.95"/>
    <circle cx="70" cy="-10" r="4.5" fill="#F7FAFF" opacity="0.95"/>

    <ellipse cx="-105" cy="46" rx="26" ry="13" fill="#F7FAFF" fill-opacity="0.92"/>
    <ellipse cx="105" cy="46" rx="26" ry="13" fill="#F7FAFF" fill-opacity="0.92"/>

    <!-- white antenna (outline family; not solid blue fill mascot) -->
    <rect x="-11" y="-308" width="22" height="72" rx="9" fill="#F7FAFF"/>
    <circle cx="0" cy="-336" r="34" fill="#F7FAFF"/>
  </g>
</svg>
