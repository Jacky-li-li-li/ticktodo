<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Ticktodo app icon">
  <!--
    macOS app icon master — Apple HIG / Icon Composer grid aligned:
    • 1024×1024 full-bleed opaque canvas (system applies squircle; do not bake corners)
    • Primary artwork fills ~820px large-circle visual mass
    • IP: thumbtack cloud-bean mascot on dark glass plate
    • Official ICNS sizes generated via iconutil from icon.png
  -->
  <defs>
    <linearGradient id="plate" x1="512" y1="0" x2="512" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E2B45"/>
      <stop offset="42%" stop-color="#121A27"/>
      <stop offset="100%" stop-color="#070B12"/>
    </linearGradient>
    <radialGradient id="sheen" cx="36%" cy="20%" r="58%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="beanShade" cx="50%" cy="32%" r="68%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#F2F6FD"/>
      <stop offset="100%" stop-color="#DDE6F5"/>
    </radialGradient>
    <filter id="lift" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#plate)"/>
  <rect width="1024" height="1024" fill="url(#sheen)"/>

  <g transform="translate(512 540) scale(1.62 1.38)" filter="url(#lift)">
    <path
      fill="url(#beanShade)"
      d="M0 -248
         C118 -248 225 -175 248 -55
         C258 15 242 78 205 120
         C230 148 248 188 248 228
         C248 278 205 312 155 312
         C118 312 92 292 78 268
         C62 298 32 318 0 318
         C-32 318 -62 298 -78 268
         C-92 292 -118 312 -155 312
         C-205 312 -248 278 -248 228
         C-248 188 -230 148 -205 120
         C-242 78 -258 15 -248 -55
         C-225 -175 -118 -248 0 -248 Z"/>

    <circle cx="-78" cy="-28" r="48" fill="#121A27"/>
    <circle cx="78" cy="-28" r="48" fill="#121A27"/>
    <circle cx="-58" cy="-48" r="14" fill="#F7FAFF"/>
    <circle cx="98" cy="-48" r="14" fill="#F7FAFF"/>
    <circle cx="-82" cy="-12" r="6" fill="#F7FAFF" opacity="0.9"/>
    <circle cx="74" cy="-12" r="6" fill="#F7FAFF" opacity="0.9"/>

    <ellipse cx="-98" cy="42" rx="26" ry="13" fill="#FF8A9B" fill-opacity="0.42"/>
    <ellipse cx="98" cy="42" rx="26" ry="13" fill="#FF8A9B" fill-opacity="0.42"/>

    <rect x="-11" y="-300" width="22" height="68" rx="8" fill="#0A84FF"/>
    <circle cx="0" cy="-328" r="34" fill="#0A84FF"/>
    <circle cx="-8" cy="-336" r="10" fill="#FFFFFF" fill-opacity="0.38"/>
  </g>
</svg>
